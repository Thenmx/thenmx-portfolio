<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogo prodotti · Frittoking</title>
  <meta name="description" content="Catalogo prodotti Frittoking · BIANCHE e FARCITE">
  <!-- Demo pubblicata per presentazione: non indicizzare. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#161624">
  <!-- OG:START (generato da scripts/import-catalog.ps1) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Frittoking">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Catalogo prodotti Frittoking">
  <meta property="og:description" content="Catalogo prodotti Frittoking · BIANCHE e FARCITE">
  <meta property="og:image" content="https://thenmx.com/demo/frittoking/assets/og-frittoking.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo Frittoking">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:url" content="https://thenmx.com/demo/frittoking/">
  <!-- OG:END -->
  <link rel="icon" href="assets/logo-frittoking.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/styles.css?v=13">
</head>
<body>
  <header class="navbar">
    <div class="container navbar__inner">
      <a class="navbar__brand" href="./" aria-label="Frittoking – Catalogo prodotti">
        <img src="assets/logo-frittoking.svg" alt="Frittoking" width="80" height="44">
      </a>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">CATALOGO PRODOTTI</h1>

    <div class="type-selector" role="tablist" aria-label="Tipologia prodotto">
      <button class="type-selector__tab" type="button" role="tab" id="tab-bianche" data-type="BIANCHE" aria-controls="product-panel">BIANCHE</button>
      <button class="type-selector__tab" type="button" role="tab" id="tab-farcite" data-type="FARCITE" aria-controls="product-panel">FARCITE</button>
    </div>

    <section id="product-panel" role="tabpanel" tabindex="-1">
      <ul class="product-list" id="product-list"></ul>
      <p class="product-list__empty" id="product-list-empty" hidden>Nessun prodotto in questa tipologia.</p>

      <section class="contact" aria-labelledby="contact-title">
        <h2 class="contact__title" id="contact-title">Hai bisogno di maggiori informazioni?</h2>
        <div class="contact__actions">
          <a class="button button--primary contact__phone" id="contact-phone">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6.6 3.5h2.6l1.4 4-2 1.5a12 12 0 0 0 6.4 6.4l1.5-2 4 1.4v2.6a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Chiamaci
          </a>
          <a class="button button--secondary contact__email" id="contact-email">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Inviaci una email
          </a>
        </div>
        <p class="contact__todo" id="contact-todo" hidden></p>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/products.js?v=13"></script>
  <script src="data/site.js?v=13"></script>
  <script src="assets/app.js?v=13"></script>
</body>
</html>
